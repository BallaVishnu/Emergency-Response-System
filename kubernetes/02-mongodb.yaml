# MongoDB Replica Set 0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-rs0
  namespace: emergency
spec:
  serviceName: mongo-rs0
  replicas: 2
  selector:
    matchLabels:
      app: mongo-rs0
  template:
    metadata:
      labels:
        app: mongo-rs0
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          command:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-rs0
  namespace: emergency
spec:
  clusterIP: None
  selector:
    app: mongo-rs0
  ports:
    - port: 27017

