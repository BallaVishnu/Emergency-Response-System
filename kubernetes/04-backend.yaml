# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: emergency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: emergency-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: emergency-config
            - secretRef:
                name: emergency-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: emergency
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000

---
# Matching Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-worker
  namespace: emergency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-worker
  template:
    metadata:
      labels:
        app: matching-worker
    spec:
      containers:
        - name: worker
          image: emergency-api:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--spring.main.web-application-type=none"
            - "--app.role=worker"
          envFrom:
            - configMapRef:
                name: emergency-config
            - secretRef:
                name: emergency-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
