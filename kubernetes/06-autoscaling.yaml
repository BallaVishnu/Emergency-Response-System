apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-worker
  namespace: emergency
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70