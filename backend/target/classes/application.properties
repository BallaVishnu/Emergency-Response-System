server.port=${API_PORT:8000}
springdoc.swagger-ui.path=/docs
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://emergency:emergency@localhost:5672/}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
app.role=${APP_ROLE:api}
app.mongo.db=${MONGO_DB:emergency}
app.mongo.shard0-uri=${MONGO_SHARD0_URI:mongodb://localhost:27017/?replicaSet=rs0}
app.mongo.shard1-uri=${MONGO_SHARD1_URI:mongodb://localhost:27018/?replicaSet=rs1}
app.mongo.shard2-uri=${MONGO_SHARD2_URI:mongodb://localhost:27019/?replicaSet=rs2}
app.matching-radius-km=${MATCHING_RADIUS_KM:100}
app.heartbeat-timeout-seconds=${HEARTBEAT_TIMEOUT_SECONDS:30}
